# Pocket FDE: Distributed Source Configuration
#
# This file defines where your data lives and how to fetch it.
# Edit this to match your actual data sources and preferences.
#
# Generated by: onboard.py
# Last updated: 2026-10-06

data_sources:

  # Incident/case records (historical incidents)
  cases:
    type: "local"
    path: "./cases"
    description: "Historical incident cases stored locally"

  # Second Brain: Curated knowledge (solutions, learnings, patterns)
  second_brain:
    type: "local"
    path: "./second-brain"
    description: "Curated incident cards, solutions, patterns"

  # Documentation: Feature docs, troubleshooting, FAQs
  documentation:
    type: "local"
    path: "./docs/customer"
    description: "Customer-friendly docs, guides, FAQ"

  # Code Repository: Source code, services, config
  code:
    type: "local"
    path: "./repos"
    description: "Application source code and services"

# Pipeline orchestration
pipeline:

  # Order to fetch sources (can be any permutation)
  order:
    - "cases"           # Start with historical cases
    - "second_brain"    # Then check curated knowledge
    - "documentation"   # Then fetch relevant docs
    - "code"            # Finally pull code context

  # Execution mode
  execution: "parallel"  # "parallel" (fast, async) or "sequential" (slow, simple)

# Skill settings
settings:

  # Cache results locally to speed up repeated queries
  cache_results: true

  # Timeout per source (milliseconds)
  timeout_per_source_ms: 5000

  # Debug logging
  debug: false

# Future: When you add MCP or Web sources, just change "type" and add endpoint/url
#
# Example MCP source:
#   second_brain:
#     type: "mcp"
#     endpoint: "mcp://knowledge-service:5000"
#
# Example Web source:
#   documentation:
#     type: "web"
#     base_url: "https://docs.example.com"
