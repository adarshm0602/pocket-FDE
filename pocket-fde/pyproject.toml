[project]
name = "pocket-fde-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml==6.0.2",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "cryptography==50.0.2",
  "vercel==0.11.5",
]

[tool.vercel]
entrypoint = "web.app:app"

[tool.vercel.scripts]
build = "python -m web.hybrid"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
