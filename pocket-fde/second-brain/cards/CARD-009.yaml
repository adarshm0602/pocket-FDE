  tone shift mid-conversation.
config_involved:
- llm.failover.enabled=true
evidence_checked:
- q.failover (confirmed provider-a → provider-b transition attributable to rate limiting)
ruled_out:
- adapter change
- validation
fix: Works as designed; customer decides whether to disable failover or raise the
  rate limit.
detection_tip: Look for q.failover lines (v3 only).
