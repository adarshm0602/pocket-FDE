openapi: 3.0.3
info:
  title: post_to_ui.v2
  version: v2
  description: hop P -> R|U
paths:
  response:
    post:
      summary: response
      requestBody:
        $ref: '#/components/schemas/Body'
components:
  schemas:
    Body:
      type: object
      required:
      - final_text
      - citations
      - trace_id
      properties:
        final_text:
          description: string
        citations:
          description: array
        followups:
          description: array (interactive only; absent for One-Way)
        feedback_token:
          description: string (v3)
        trace_id:
          description: string
